id: T1070.004
name: "Indicator Removal - File Deletion"
tactic: defense-evasion
technique: "Indicator Removal: File Deletion"
platforms: [linux, windows]
risk: low
description: "Creates and deletes files to simulate evidence destruction"
tests:
  - name: "Create and delete test artifacts"
    executor: bash
    command: |
      TMPDIR=$(mktemp -d /tmp/halberd-test-XXXXXX)
      echo "sensitive-data-simulation" > "$TMPDIR/evidence.txt"
      echo "Created: $TMPDIR/evidence.txt"
      rm -f "$TMPDIR/evidence.txt"
      echo "Deleted: $TMPDIR/evidence.txt"
      shred -u "$TMPDIR" 2>/dev/null || rm -rf "$TMPDIR"
      echo "indicator-removal-complete"
    cleanup: |
      rm -rf /tmp/halberd-test-* 2>/dev/null || true
    expected_artifacts:
      - type: process
        value: "shred"
      - type: file_modification
        value: "/tmp/halberd-test-*"
    detection_notes: "Use of shred is a strong indicator of evidence destruction; EDR should flag shred or secure-delete operations"
