<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Halberd BAS{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">&#9876;</span>
            <span class="nav-title">Halberd BAS</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/library" class="nav-link">Library</a>
            <a href="/campaigns" class="nav-link">Campaigns</a>
            <a href="/results" class="nav-link">Results</a>
            <a href="/import" class="nav-link">Import</a>
            <a href="/docs" class="nav-link" target="_blank">API</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>Halberd BAS v0.1.0 &mdash; Open-source Breach and Attack Simulation</p>
    </footer>
    <script src="/static/app.js"></script>
</body>
</html>
